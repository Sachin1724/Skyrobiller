appId: com.skyrobiller.app
productName: Skyro Biller
copyright: Copyright © 2026 Skyro Biller Team
directories:
  output: release
  buildResources: resources # holds icon.png; "build/" is git-ignored
files:
  - dist
  - dist-electron
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: Skyro-Biller-Setup-${version}.${ext} # no spaces: GitHub renames spaced files, which would break the updater's latest.yml
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Skyro Biller

# New versions are published as GitHub Releases; the installed app checks there and updates itself
portable:
  artifactName: Skyro-Biller-${version}-portable.${ext}

publish:
  provider: github
  owner: Sachin1724
  repo: Skyrobiller
