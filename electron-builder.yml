appId: com.skyrobiller.app
productName: Skyro Biller
copyright: Copyright © 2026 Skyro Biller Team
directories:
  output: release
  buildResources: resources # holds icon.png; "build/" is git-ignored
files:
  - dist
  - dist-electron
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Skyro Biller

